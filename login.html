<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    padding: 20px;
    background:
        linear-gradient(rgba(3, 12, 20, 0.72), rgba(3, 12, 20, 0.82)),
        url("./AI%20Pro.jpeg");center / cover no-repeat;
    background-attachment: fixed;

}

.login-card {
    width: 430px;
    padding: 40px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(0, 217, 255, 0.25);
    border-radius: 22px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
}

h2 {
    color: #00d9ff;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 30px;
    letter-spacing: 1px;
}

.form-label {
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}

.form-control {
    width: 100%;
    height: 48px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    color: #ffffff;
    padding: 12px 15px;
    margin-bottom: 18px;
}

.form-control::placeholder {
    color: #91a4ae;
}

.form-control:focus {
    background: rgba(0, 0, 0, 0.3);
    color: #ffffff;
    border-color: #00d9ff;
    box-shadow: 0 0 12px rgba(0, 217, 255, 0.25);
}

.btn-login {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 10px;
    background: #00d9ff;
    color: #031017;
    font-size: 16px;
    font-weight: 700;
    transition: 0.3s ease;
}

.btn-login:hover {
    background: #00b8dc;
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 217, 255, 0.3);
}

.links {
    text-align: center;
    color: #b8c9d1;
    font-size: 14px;
    margin-top: 22px;
}

.links a {
    color: #00d9ff;
    text-decoration: none;
    font-weight: 600;
}

.links a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="login-card">

<h2>Login</h2>

<form action="/login_user" method="POST">

<div class="mb-3">
<label class="form-label">Email Address</label>
<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input
type="password"
name="password"
class="form-control"
placeholder="Enter your password"
required>
</div>

<button type="submit" class="btn btn-login">
Login
</button>

</form>

<div class="links">

<a href="/forgot_password">Forgot Password?</a>

<br><br>

Don't have an account?

<a href="/register">Register</a>

</div>

</div>

</body>

</html>

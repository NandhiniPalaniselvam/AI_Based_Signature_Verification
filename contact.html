<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact | Forensic AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#e5eef3;
    background:
    linear-gradient(rgba(3,20,35,.38),rgba(3,18,32,.52)),
    url("/static/images/AI Pro.jpeg") center/cover fixed no-repeat;
}

.navbar{
    background:rgba(3,16,28,.72)!important;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(72,199,255,.25);
    padding:14px 45px;
}

.navbar-brand{
    color:#48c7ff!important;
    font-size:20px;
    font-weight:700;
    letter-spacing:.5px;
}

.nav-link{
    color:#d0dce2!important;
    font-size:14px;
    margin-left:22px;
    transition:.3s;
}

.nav-link:hover,.nav-link.active{
    color:#48c7ff!important;
}

.contact-section{
    min-height:calc(100vh - 130px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:55px 20px;
}

.contact-box{
    width:100%;
    max-width:620px;
    background:rgba(7,25,39,.70);
    border:1px solid rgba(255,255,255,.20);
    border-radius:16px;
    padding:42px 48px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 20px 50px rgba(0,0,0,.40);
}

h2{
    color:#fff;
    font-size:30px;
    font-weight:700;
    letter-spacing:.5px;
}

.contact-subtitle{
    color:#65d8ff;
    font-size:13px;
    text-align:center;
    margin:8px 0 30px;
}

.form-label{
    color:#dce8ed;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

.form-control{
    background:rgba(255,255,255,.08);
    color:#fff;
    border:1px solid rgba(255,255,255,.18);
    border-radius:8px;
    padding:11px 13px;
}

.form-control::placeholder{
    color:#9eafb8;
}

.form-control:focus{
    background:rgba(255,255,255,.10);
    color:#fff;
    border-color:#48c7ff;
    box-shadow:0 0 9px rgba(72,199,255,.20);
}

.btn-primary{
    width:100%;
    background:#087ea5;
    border:none;
    border-radius:8px;
    padding:11px;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

.btn-primary:hover{
    background:#05627f;
    transform:translateY(-1px);
}

footer{
    background:rgba(3,15,25,.80);
    color:#8a9ca5;
    font-size:12px;
    text-align:center;
    padding:20px;
    border-top:1px solid rgba(72,199,255,.15);
}

@media(max-width:768px){
    .navbar{
        padding:14px 20px;
    }

    .nav-link{
        margin-left:0;
    }

    .contact-section{
        padding:40px 15px;
    }

    .contact-box{
        padding:32px 24px;
    }

    h2{
        font-size:26px;
    }
}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
<div class="container-fluid">
<a class="navbar-brand" href="/">Forensic AI</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">
<div class="navbar-nav ms-auto">
<a class="nav-link" href="/">Home</a>
<a class="nav-link" href="/about">About</a>
<a class="nav-link active" href="/contact">Contact</a>
<a class="nav-link" href="/login">Login</a>
</div>
</div>
</div>
</nav>

<section class="contact-section">
<div class="contact-box">

<h2 class="text-center">Contact Us</h2>
<p class="contact-subtitle">Forensic AI Signature Verification System</p>

<form action="/contact" method="POST">

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" name="name" placeholder="Enter your name" required>
</div>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" name="email" placeholder="Enter your email" required>
</div>

<div class="mb-3">
<label class="form-label">Message</label>
<textarea class="form-control" rows="5" name="message" placeholder="Enter your message" required></textarea>
</div>

<button type="submit" class="btn btn-primary">Send Message</button>

</form>
</div>
</section>

<footer>
© 2026 AI Based Signature Verification | Forensic Document Analysis
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AI Signature Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    <!--background:linear-gradient(135deg,#0f172a,#111827,#1e293b);-->
    padding:20px;
    padding: 20px;
    background:
        linear-gradient(rgba(3, 12, 20, 0.31), rgba(3, 12, 20, 0.82)),
        url("./AI%20Pro.jpeg");center / cover no-repeat;
    background-attachment: fixed;
}

.card{
    width:460px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:35px;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

h2{
    color:#00d9ff;
    text-align:center;
    margin-bottom:25px;
    font-weight:700;
}

.form-label{
    color:#ffffff;
    font-size:15px;
    font-weight:500;
    margin-bottom:6px;
    display:block;
}

.form-control{
    width:100%;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.15);
    color:#ffffff;
    padding:12px;
    border-radius:10px;
    margin-bottom:18px;
}

.form-control::placeholder{
    color:#cfcfcf;
}

.form-control:focus{
    background:rgba(255,255,255,.15);
    color:#ffffff;
    border:1px solid #00d9ff;
    box-shadow:0 0 10px rgba(0,217,255,.3);
    outline:none;
}

.form-control:focus::placeholder{
    color:#ffffff;
}

.btn-register{
    width:100%;
    padding:12px;
    background:#00d9ff;
    color:#000;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn-register:hover{
    background:#0099cc;
    color:#ffffff;
    transform:translateY(-2px);
}

p{
    text-align:center;
    color:#ffffff;
    margin-top:18px;
    font-size:14px;
}

a{
    color:#00d9ff;
    text-decoration:none;
    font-weight:600;
}

a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="card">

<h2>CREATE ACCOUNT</h2>

<form action="/register_user" method="POST">
    <form action="/register_user" method="POST">

    <div class="mb-3">
        <label class="form-label text-white">Full Name</label>
        <input type="text"
               name="fullname"
               class="form-control"
               placeholder="Enter your full name"
               required>
    </div>

    <!--<div class="mb-3">
        <label class="form-label text-white">Username</label>
        <input type="text"
               name="username"
               class="form-control"
               placeholder="Choose a username"
               required>
    </div>-->

    <div class="mb-3">
        <label class="form-label text-white">Email Address</label>
        <input type="email"
               name="email"
               class="form-control"
               placeholder="Enter your email"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label text-white">Phone Number</label>
        <input type="tel"
               name="phone"
               class="form-control"
               placeholder="Enter your phone number"
               maxlength="10"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label text-white">Password</label>
        <input type="password"
               name="password"
               class="form-control"
               placeholder="Create a password"
               required>
    </div>

    <button type="submit" class="btn btn-register w-100">
        Register
    </button>

</form>
</form>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Signature</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #08111f, #0d1b2a);
            color: white;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.45);
            padding: 15px 40px;
        }

        .navbar-brand {
            color: #00d9ff !important;
            font-weight: 700;
            font-size: 22px;
        }

        .nav-link {
            color: #ddd !important;
            margin-left: 15px;
        }

        .nav-link:hover {
            color: #00d9ff !important;
        }

        .verify-container {
            max-width: 950px;
            margin: 60px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h1 {
            font-size: 32px;
            font-weight: 700;
        }

        .title p {
            color: #aaa;
            margin-top: 10px;
        }

        .upload-box {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 30px;
            height: 100%;
            transition: 0.3s;
        }

        .upload-box:hover {
            border-color: #00d9ff;
            transform: translateY(-3px);
        }

        .upload-box h3 {
            color: #00d9ff;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .upload-box p {
            color: #aaa;
            font-size: 14px;
        }

        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.08);
            color: white;
            border-color: #00d9ff;
            box-shadow: none;
        }

        .form-control::file-selector-button {
            background: #00d9ff;
            border: none;
            padding: 8px 12px;
            margin-right: 10px;
            border-radius: 5px;
        }

        .verify-btn {
            background: #00d9ff;
            color: #001018;
            border: none;
            padding: 13px 45px;
            border-radius: 8px;
            font-weight: 700;
            margin-top: 35px;
        }

        .verify-btn:hover {
            background: #00b8d9;
        }

        .preview {
            max-width: 100%;
            max-height: 180px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand" href="/dashboard">
            SignatureVerify AI
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/verify">Verify</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/history">History</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contact">Contact</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- Verify Section -->

<div class="verify-container">

    <div class="title">
        <h1>Signature Verification</h1>
        <p>Upload two signatures to compare their similarity.</p>
    </div>


    <form action="/verify_signature"
          method="POST"
          enctype="multipart/form-data">

        <div class="row g-4">

            <!-- Reference Signature -->

            <div class="col-md-6">

                <div class="upload-box">

                    <h3>Reference Signature</h3>

                    <p>
                        Upload the genuine/reference signature.
                    </p>

                    <input
                        type="file"
                        class="form-control"
                        name="reference_signature"
                        id="reference_signature"
                        accept="image/*"
                        required
                    >

                    <img
                        id="reference_preview"
                        class="preview"
                        alt="Reference Signature Preview"
                    >

                </div>

            </div>


            <!-- Signature To Verify -->

            <div class="col-md-6">

                <div class="upload-box">

                    <h3>Signature to Verify</h3>

                    <p>
                        Upload the signature that needs verification.
                    </p>

                    <input
                        type="file"
                        class="form-control"
                        name="verify_signature"
                        id="verify_signature"
                        accept="image/*"
                        required
                    >

                    <img
                        id="verify_preview"
                        class="preview"
                        alt="Signature Preview"
                    >

                </div>

            </div>

        </div>


        <div class="text-center">

            <button type="submit" class="verify-btn">
                Verify Signature
            </button>

        </div>

    </form>

</div>


<script>

function previewImage(input, previewId) {

    const preview = document.getElementById(previewId);

    if (input.files && input.files[0]) {

        const reader = new FileReader();

        reader.onload = function(e) {

            preview.src = e.target.result;
            preview.style.display = "block";

        };

        reader.readAsDataURL(input.files[0]);
    }
}


document.getElementById("reference_signature")
.addEventListener("change", function() {

    previewImage(this, "reference_preview");

});


document.getElementById("verify_signature")
.addEventListener("change", function() {

    previewImage(this, "verify_preview");

});

</script>

</body>
</html>

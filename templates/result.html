<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
            color:white;
            min-height:100vh;
        }

        .result-container{
            width:90%;
            max-width:950px;
            margin:50px auto;
            background:#1e293b;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,217,255,.3);
        }

        h2{
            text-align:center;
            color:#00d9ff;
            margin-bottom:35px;
        }

        .image-box{
            height:250px;
            border:2px dashed #00d9ff;
            border-radius:10px;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f172a;
            color:#ccc;
        }

        .details{
            margin-top:40px;
            background:#0f172a;
            padding:25px;
            border-radius:10px;
        }

        .details p{
            font-size:18px;
            margin-bottom:15px;
        }

        .result{
            color:#00ff88;
            font-weight:bold;
        }

        .score{
            color:#00d9ff;
            font-weight:bold;
        }

        .btn-area{
            margin-top:30px;
            text-align:center;
        }

        .btn{
            margin:10px;
            padding:12px 25px;
        }
    </style>
</head>

<body>

<div class="result-container">

<h2>Verification Result</h2>

<div class="row">

<div class="col-md-6">
<h5 class="text-center mb-3">Uploaded Signature</h5>

<div class="image-box">
Uploaded Image
</div>
</div>

<div class="col-md-6">
<h5 class="text-center mb-3">Reference Signature</h5>

<div class="image-box">
Reference Image
</div>
</div>

</div>

<div class="details">

<p><strong>Prediction :</strong>
<span class="result">✅ Genuine Signature</span>
</p>

<p><strong>Similarity Score :</strong>
<span class="score">96.45%</span>
</p>

<p><strong>Verification Date :</strong>
27-07-2026
</p>

<p><strong>Verification Time :</strong>
04:35 PM
</p>

</div>

<div class="btn-area">

<a href="/verify" class="btn btn-info">
Verify Another
</a>

<a href="/history" class="btn btn-success">
View History
</a>

<a href="/dashboard" class="btn btn-secondary">
Dashboard
</a>

</div>

</div>

</body>
</html>
